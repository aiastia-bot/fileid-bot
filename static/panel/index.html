<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="styles.css?v=4">
<title>管理面板</title>
</head>
<body>
<div id="fatal" class="fatal"></div>
<div id="app" v-cloak>
  <div class="head">
    <h1>🖥 管理面板</h1>
    <span class="badge">管理员</span>
  </div>
  <div v-if="!ready" class="muted">{{ gateText }}</div>
  <template v-else>

    <h2>📊 平台概览</h2>
    <div class="grid" v-if="stats">
      <div class="card stat" v-for="item in statCards" :key="item.label">
        <div class="num">{{ item.value }}</div>
        <div class="label">{{ item.label }}</div>
      </div>
    </div>
    <p class="muted" v-else-if="errors.stats"><span class="error">加载失败：{{ errors.stats }}</span></p>
    <p class="muted" v-else><span class="spin"></span> 加载中…</p>
    <div class="bar">
      <button class="primary" @click="loadStats">🔄 刷新</button>
      <span class="muted" v-if="updated">更新于 {{ updated }}</span>
    </div>

    <h2>🤖 Bot 列表</h2>
    <div class="bar top">
      <input v-model.trim="botSearch" placeholder="搜索用户名 / 显示名 / 主人 ID" @keydown.enter="runSearch">
      <button class="primary" @click="runSearch">搜索</button>
    </div>
    <div class="chips">
      <span class="chip" v-for="f in botFilters" :key="f[0]"
            :class="{ on: botStatus === f[0] }" @click="setBotFilter(f[0])">{{ f[1] }}</span>
    </div>
    <p class="muted" v-if="errors.bots"><span class="error">加载失败：{{ errors.bots }}</span></p>
    <p class="muted" v-else-if="!botsLoaded"><span class="spin"></span> 加载中…</p>
    <p class="muted" v-else-if="!bots.length">暂无符合条件的 Bot</p>
    <template v-for="bot in bots" :key="bot.id">
      <div class="card clickable" @click="toggleDetail(bot)">
        <div class="botline">
          <span class="name">{{ bot.firstname }} @{{ bot.username || '—' }}</span>
          <span class="pill" :class="stateColor(bot.status)">
            <span class="dot" style="background: currentColor"></span>{{ bot.status_label }}
          </span>
        </div>
        <div class="sub">主人 {{ bot.owner_id }} · 文件 {{ fmt(bot.file_count) }} · DB {{ bot.id }}
          · 创建 {{ bot.created_at }}<template v-if="bot.node_id"> · 节点 {{ bot.node_id }}</template>
          · {{ detail && detail.botId === bot.id ? '收起' : '点击展开' }}</div>
      </div>
      <div class="card detail" v-if="detail && detail.botId === bot.id">
        <div class="botline">
          <span class="name">📂 @{{ detail.username }}</span>
          <span class="pill">{{ detail.tab === 'files' ? '文件' : '集合' }}</span>
        </div>
        <div class="chips">
          <span class="chip" :class="{ on: detail.tab === 'files' }" @click="setDetailTab('files')">文件</span>
          <span class="chip" :class="{ on: detail.tab === 'collections' }" @click="setDetailTab('collections')">集合</span>
        </div>
        <template v-if="detail.tab === 'files'">
          <div class="chips">
            <span class="chip" v-for="t in fileTypes" :key="t[0]"
                  :class="{ on: detail.fileType === t[0] }" @click="setFileType(t[0])">{{ t[1] }}</span>
          </div>
          <div class="chips">
            <span class="chip" v-for="s in fileSorts" :key="s[0]"
                  :class="{ on: detail.sort === s[0] }" @click="setFileSort(s[0])">{{ s[1] }}</span>
          </div>
          <p class="muted" v-if="detail.error"><span class="error">加载失败：{{ detail.error }}</span></p>
          <p class="muted" v-else-if="detail.loading"><span class="spin"></span> 加载中…</p>
          <p class="muted" v-else-if="!detail.files.length">该 Bot 没有符合条件的文件</p>
          <div v-else>
            <div v-for="file in detail.files" :key="file.code">
              <div class="fileline">
                <span class="mono">{{ typeEmoji(file.file_type) }} {{ file.code }}</span>
                <span class="size">{{ humanSize(file.file_size) }}</span>
              </div>
              <div class="sub">{{ file.created_at }} · 上传者 {{ file.user_id ?? '—' }}</div>
            </div>
          </div>
          <pager :page="detail.page" :last="detail.lastPage" :total="detail.total"
                 unit="个文件" @go="goDetailPage($event)"></pager>
        </template>
        <template v-else>
          <p class="muted" v-if="detail.error"><span class="error">加载失败：{{ detail.error }}</span></p>
          <p class="muted" v-else-if="detail.loading"><span class="spin"></span> 加载中…</p>
          <p class="muted" v-else-if="!detail.collections.length">该 Bot 没有集合</p>
          <div v-else>
            <div class="card" v-for="col in detail.collections" :key="col.code">
              <div class="botline">
                <span class="name">{{ col.name || '（未命名）' }}</span>
                <span class="pill" :class="col.status === 'completed' ? 'green' : 'amber'">
                  {{ col.status === 'completed' ? '已完成' : col.status }}</span>
              </div>
              <div class="sub">{{ col.code }} · {{ fmt(col.file_count) }} 个文件 · 创建 {{ col.created_at }}</div>
            </div>
          </div>
          <pager :page="detail.page" :last="detail.lastPage" :total="detail.total"
                 unit="个集合" @go="goDetailPage($event)"></pager>
        </template>
      </div>
    </template>
    <div class="bar">
      <button :disabled="botPage <= 1" @click="goBots(botPage - 1)">‹ 上一页</button>
      <span class="muted">第 {{ botPage }}/{{ botLastPage }} 页 · 共 {{ fmt(botsTotal) }}</span>
      <button :disabled="botPage >= botLastPage" @click="goBots(botPage + 1)">下一页 ›</button>
    </div>

    <h2>👤 用户查询</h2>
    <div class="bar">
      <input v-model.trim="uidInput" type="number" inputmode="numeric" placeholder="输入用户 ID"
             @keydown.enter="loadUser(uidInput)">
      <button class="primary" @click="loadUser(uidInput)">查询</button>
    </div>
    <template v-if="userResult">
      <div class="card">
        <row-line k="用户 ID" :v="String(userResult.vip.user_id)"></row-line>
        <row-line k="会员" :v="`${userResult.vip.vip_name}（等级 ${userResult.vip.vip_level}）`"></row-line>
        <row-line k="到期"
                  :v="userResult.vip.vip_expire_at ? userResult.vip.vip_expire_at + (userResult.vip.is_active ? '' : '（已过期）') : '永久'"></row-line>
        <row-line k="配额" :v="`${userResult.vip.max_bots} 个 Bot`"></row-line>
      </div>
      <div class="card">
        <div class="botline">
          <span class="name">名下 Bot 共 {{ userResult.bots.length }} 个</span>
          <span class="pill" :class="userResult.bots.length ? 'green' : 'gray'">
            活跃 {{ userResult.counts.active || 0 }}</span>
        </div>
        <div class="sub">暂停 {{ userResult.counts.paused || 0 }} ·
          失效 {{ failedCount(userResult.counts) }} · 已删除 {{ userResult.counts.deleted || 0 }}</div>
      </div>
      <div class="card" v-for="bot in userResult.bots" :key="bot.id">
        <div class="botline">
          <span class="name">@{{ bot.username || '—' }}</span>
          <span class="pill" :class="stateColor(bot.status)">{{ bot.status_label }}</span>
        </div>
        <div class="sub">DB {{ bot.id }} · 创建 {{ bot.created_at }}</div>
      </div>
    </template>
    <p class="muted" v-else-if="errors.user"><span class="error">查询失败：{{ errors.user }}</span></p>

    <h2>🎟 兑换码</h2>
    <div class="bar top">
      <button class="primary" @click="showGen = !showGen">{{ showGen ? '收起生成表单' : '➕ 生成兑换码' }}</button>
    </div>
    <div class="card" v-if="showGen">
      <form class="inline" @submit.prevent="createCodes">
        <div class="field"><label>等级</label>
          <select v-model.number="genForm.level">
            <option v-for="l in levels" :key="l.value" :value="l.value">{{ l.label }}</option>
          </select>
        </div>
        <div class="field"><label>月份</label>
          <input v-model.number="genForm.months" type="number" min="0" max="120" placeholder="0 = 永久">
        </div>
        <div class="field"><label>数量</label>
          <input v-model.number="genForm.count" type="number" min="1" max="50">
        </div>
        <div class="field"><label>有效期天</label>
          <input v-model="genForm.expiresDays" type="number" min="1" placeholder="空 = 长期有效">
        </div>
        <button class="primary" type="submit" :disabled="busy">生成</button>
      </form>
      <p class="error" v-if="genError">{{ genError }}</p>
      <div class="codes-box" v-if="genResult">
        <div class="muted">批次 {{ genResult.batch }} · 已生成 {{ genResult.codes.length }} 个（同等级叠加，跨等级新周期）</div>
        <div class="code mono" v-for="code in genResult.codes" :key="code">{{ code }}</div>
        <div class="bar"><button class="mini primary" @click="copyCodes">📋 复制全部</button></div>
        <p class="ok" v-if="copied">{{ copied }}</p>
      </div>
    </div>
    <div class="chips">
      <span class="chip" v-for="f in codeFilters" :key="f[0]"
            :class="{ on: codeStatus === f[0] }" @click="setCodeFilter(f[0])">{{ f[1] }}</span>
    </div>
    <p class="muted" v-if="errors.codes"><span class="error">加载失败：{{ errors.codes }}</span></p>
    <p class="muted" v-else-if="!codesLoaded"><span class="spin"></span> 加载中…</p>
    <p class="muted" v-else-if="!codes.length">暂无兑换码</p>
    <div class="card" v-for="code in codes" :key="code.code">
      <div class="botline">
        <span class="code mono">{{ code.code }}</span>
        <span class="pill" :class="codeStatusColor(code.status)">{{ codeStatusLabel(code.status) }}</span>
      </div>
      <div class="sub">等级 {{ code.vip_level }} · {{ code.months === 0 ? '永久' : code.months + '个月' }}
        · 批次 {{ code.batch }}<template v-if="code.redeemed_by"> · 已兑 {{ code.redeemed_by }}</template>
        <template v-if="code.expires_at"> · 有效期至 {{ code.expires_at }}</template></div>
      <div class="bar" v-if="code.status === 'pending'">
        <button class="danger" @click="cancelCode(code.code)">作废</button>
      </div>
    </div>
    <div class="bar top">
      <input v-model.trim="revokeBatch" placeholder="按批次号作废（如 11281530ab）">
      <button class="danger" @click="cancelBatch">作废整批</button>
    </div>

    <h2>🎁 定向赠送</h2>
    <div class="card" v-if="!gift.confirmed">
      <div class="chips">
        <span class="chip" :class="{ on: gift.group === 'paid' }" @click="gift.group = 'paid'">历史付费用户</span>
        <span class="chip" :class="{ on: gift.group === 'vip' }" @click="gift.group = 'vip'">当前付费会员</span>
      </div>
      <form class="inline" @submit.prevent="loadGiftTargets">
        <div class="field"><label>赠送等级</label>
          <select v-model.number="gift.level">
            <option v-for="l in levels" :key="l.value" :value="l.value">{{ l.label }}</option>
          </select>
        </div>
        <div class="field"><label>时长（月）</label>
          <input v-model.number="gift.months" type="number" min="0" max="120" placeholder="0 = 永久">
        </div>
        <div class="field"><label>码有效期</label>
          <input v-model="gift.expiresDays" type="number" min="1" placeholder="天，空 = 长期">
        </div>
        <div class="field"><label>备注</label>
          <input v-model.trim="gift.reason" placeholder="选填，写入审计">
        </div>
        <button class="primary" type="submit" :disabled="gift.loading">
          {{ gift.loading ? '获取中…' : '获取名单' }}</button>
      </form>
      <p class="muted" style="margin-top:8px">每人一个一次性码，主 Bot 私信送达；已持有同等级待领码的用户自动跳过。</p>
      <p class="error" v-if="gift.error">{{ gift.error }}</p>
    </div>
    <div class="card" v-else>
      <div class="botline">
        <span class="name">确认名单：{{ gift.selected.length }} 人</span>
        <span class="pill amber">{{ gift.group === 'paid' ? '历史付费' : '当前会员' }}
          · 等级 {{ gift.level }} · {{ gift.months === 0 ? '永久' : gift.months + '个月' }}</span>
      </div>
      <div class="sub">⚠️ 待领码 = 已持有同等级未兑换码（发送时自动跳过）。可移除或手动添加用户。</div>
      <div class="bar top">
        <input v-model.trim="gift.addId" type="number" inputmode="numeric"
               placeholder="添加用户 ID" @keydown.enter="giftAddUser">
        <button @click="giftAddUser">添加</button>
        <button @click="gift.confirmed = false">返回修改</button>
      </div>
      <div class="fileline" v-for="(u, index) in gift.selected" :key="u.user_id">
        <span class="mono">{{ u.user_id }}<template v-if="u.paid_total">
          · 已付 {{ fmt(u.paid_total) }}⭐</template><template v-if="u.vip_level">
          · 等级 {{ u.vip_level }}</template></span>
        <span class="botline">
          <span class="pill amber" v-if="u.pending_same_level">⚠️ 待领码</span>
          <button class="mini danger" @click="gift.selected.splice(index, 1)">移除</button>
        </span>
      </div>
      <p class="error" v-if="gift.error">{{ gift.error }}</p>
      <div class="bar">
        <button class="primary" :disabled="gift.sending || !gift.selected.length"
                @click="sendGift">{{ gift.sending ? '发送中…' : '✅ 发送给 ' + gift.selected.length + ' 人' }}</button>
      </div>
      <template v-if="gift.result">
        <div class="ok">✅ 已发送 {{ gift.result.sent.length }} 人 · 批次 {{ gift.result.batches.join('、') }}</div>
        <div class="error" v-if="gift.result.failed.length">
          失败 {{ gift.result.failed.length }}：<span
            v-for="f in gift.result.failed" :key="f.user_id">{{ f.user_id }}（{{ f.error }}）　</span></div>
        <div class="muted" v-if="gift.result.skipped.length">
          跳过（已有同等级待领码）：{{ gift.result.skipped.join('、') }}</div>
      </template>
    </div>

    <h2>💎 付费会员</h2>
    <div class="bar top">
      <button class="primary" @click="showVipForm = !showVipForm">{{ showVipForm ? '收起' : '⚙️ 设置会员' }}</button>
    </div>
    <div class="card" v-if="showVipForm">
      <form class="inline" @submit.prevent="setVip">
        <div class="field"><label>用户 ID</label>
          <input v-model.trim="vipForm.userId" type="number" inputmode="numeric">
        </div>
        <div class="field"><label>等级</label>
          <select v-model.number="vipForm.level">
            <option :value="0">0 取消会员</option>
            <option v-for="l in levels" :key="l.value" :value="l.value">{{ l.label }}</option>
          </select>
        </div>
        <div class="field"><label>月份</label>
          <input v-model.number="vipForm.months" type="number" min="0" max="120" placeholder="0 = 永久">
        </div>
        <button class="primary" type="submit" :disabled="busy">应用（替换有效期）</button>
      </form>
      <p class="ok" v-if="vipResult">{{ vipResult }}</p>
      <p class="error" v-if="vipError">{{ vipError }}</p>
    </div>
    <p class="muted" v-if="errors.vips"><span class="error">加载失败：{{ errors.vips }}</span></p>
    <p class="muted" v-else-if="!vipsLoaded"><span class="spin"></span> 加载中…</p>
    <p class="muted" v-else-if="!vips.length">暂无付费会员</p>
    <div class="card" v-if="vips.length">
      <template v-for="member in vips" :key="member.user_id">
        <div class="botline">
          <span class="name">{{ member.user_id }}</span>
          <span class="pill" :class="member.vip_expire_at ? 'amber' : 'green'">等级 {{ member.vip_level }}</span>
        </div>
        <div class="sub">{{ member.vip_expire_at ? '到期 ' + member.vip_expire_at : '永久' }}</div>
      </template>
    </div>

    <h2>🧾 订单</h2>
    <p class="muted" v-if="errors.orders"><span class="error">加载失败：{{ errors.orders }}</span></p>
    <p class="muted" v-else-if="!ordersLoaded"><span class="spin"></span> 加载中…</p>
    <p class="muted" v-else-if="!orders.length">暂无订单</p>
    <div class="card" v-if="orders.length">
      <template v-for="order in orders" :key="order.payload">
        <div class="botline">
          <span class="name">#{{ order.payload }}</span>
          <span class="pill" :class="order.status === 'completed' || order.status === 'received' ? 'green' : 'amber'">
            {{ order.amount }}⭐ {{ order.status }}</span>
        </div>
        <div class="sub">{{ order.product }} · 用户 {{ order.user_id }} · {{ order.created_at }}</div>
      </template>
    </div>
  </template>
</div>
<script src="vendor/vue.global.prod.js?v=4"></script>
<script src="app.js?v=4"></script>
<script>
  // 自检：加载完成后 app.js 会置 __panelBooted；缺失说明资源被缓存/加载失败
  window.addEventListener('load', () => {
    setTimeout(() => {
      if (!window.__panelBooted) {
        const box = document.getElementById('fatal');
        box.style.display = 'block';
        box.textContent = '⚠️ 资源加载异常（可能缓存了旧文件）。请点小程序右上角 ⋮ 选择「重新加载」，或退出小程序后重新打开。';
      }
    }, 2500);
  });
</script>
</body>
</html>
